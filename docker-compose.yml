services:
  fluxo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.8.19}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no Environment do Dokploy}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-youtube.com,youtu.be,vimeo.com}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-2048}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-10240}
      FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-1}
      JOB_TIMEOUT_MINUTES: ${JOB_TIMEOUT_MINUTES:-60}
    volumes:
      - fluxo-downloads:/data/downloads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fluxo-downloads:
